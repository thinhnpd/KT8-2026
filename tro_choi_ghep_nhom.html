<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trò chơi ghép nhóm · S Class</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#F3F5F9}
.app{--acc:#3D78C0;--bg:#F3F5F9;--pn:#fff;--tx:#1F2937;--mu:#6B7280;--bd:#D9DEE8;--sb:#fff;--hdr:#EDF0F6;min-height:100vh;background:var(--bg);color:var(--tx);font:13px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .35s,color .35s}
.app[data-theme=dark]{--bg:#0E1320;--pn:#18202F;--tx:#E8EBF2;--mu:#9AA3B5;--bd:#2D3750;--sb:#131A29;--hdr:#202A3F}
button,input,select{font-family:inherit}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb{position:fixed;left:0;top:0;bottom:0;width:60px;background:var(--sb);border-right:.5px solid var(--bd);transition:width .25s ease,background .35s;overflow:hidden;z-index:6;white-space:nowrap;padding-top:env(safe-area-inset-top,0px)}
.sb:hover{width:244px}
.lbl{opacity:0;transition:opacity .15s}.sb:hover .lbl{opacity:1;transition:opacity .25s .08s}
.brand{display:flex;align-items:center;gap:10px;height:56px;padding:0 10px}.brand b{font-size:17px;font-weight:500}
.cls{position:relative;margin:2px 8px 10px;height:44px;border-radius:12px;overflow:hidden;background:var(--acc);transition:height .25s ease,background .35s;color:#fff}
.sb:hover .cls{height:70px}
.cls::after{content:"";position:absolute;right:-20px;top:-30px;width:90px;height:90px;border-radius:50%;background:#fff;opacity:.08}
.clogo{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;color:var(--acc);transition:all .25s}
.sb:hover .clogo{left:12px;top:12px;width:46px;height:46px;border-radius:12px}
.ctt{position:absolute;left:68px;top:24px;font-size:19px;font-weight:500}
.it{display:flex;align-items:center;gap:14px;height:40px;margin:2px 8px;padding:0 12px;border-radius:10px;color:var(--mu);cursor:pointer;transition:background .15s,color .15s}
.it:hover{background:color-mix(in srgb,var(--acc) 10%,transparent);color:var(--tx)}
.it.on{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.mn{margin-left:72px;padding:10px 16px 20px 0;max-width:1000px}
.top{display:flex;align-items:center;justify-content:space-between;height:34px}
.crumb{color:var(--mu)}.crumb b{color:var(--tx);font-weight:500}
.tools{display:flex;align-items:center;gap:14px;color:var(--mu)}
.av{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500}
.tg{position:relative;width:56px;height:28px;padding:0;border:0;border-radius:14px;background:#5B9BD8;cursor:pointer;transition:background .4s}
.tg .k{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#F2C94C;transition:transform .4s,background .4s}
.app[data-theme=dark] .tg{background:#1B2338}.app[data-theme=dark] .tg .k{transform:translateX(28px);background:#CBD0DB}
.ttl{font-size:12px;letter-spacing:.6px;color:var(--mu);margin:6px 0 10px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px;align-items:start}
.bx{background:var(--pn);border:1px solid var(--bd);padding:10px 12px}
.bx h5{margin:0 0 8px;font-size:11.5px;font-weight:500;letter-spacing:.5px;color:var(--mu);text-transform:uppercase}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row label{flex:0 0 96px;color:var(--mu);font-size:12px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--acc)}
.row output{flex:0 0 40px;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
[hidden]{display:none!important}
select,input[type=color]{flex:1;height:30px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);padding:0 8px;font-size:12.5px}
input[type=color]{padding:2px;max-width:48px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chips button,.gh{height:30px;padding:0 10px;border:1px solid var(--bd);border-radius:6px;background:transparent;color:var(--tx);font-size:12.5px;cursor:pointer}
.chips button.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc)}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 16px;border:0;border-radius:6px;background:var(--acc);color:#fff;font-size:12.5px;cursor:pointer}
button:disabled,input:disabled,select:disabled{opacity:.5;cursor:not-allowed}
#kq{margin:12px 0 0;min-height:20px;color:var(--mu);font-size:12.5px}
#kq b{color:var(--acc);font-weight:600}
canvas{width:100%;display:block;background:var(--pn);border:1px solid var(--bd)}
@media(max-width:760px){.grid{grid-template-columns:1fr}.sb{display:none}.mn{margin-left:0;padding:10px 12px 20px}}
</style>
</head>
<body>
<div class="app" id="app" data-theme="light">
<aside class="sb" aria-label="Menu chính">
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 40 40" style="flex:none" role="img" aria-label="Logo S Class"><rect x="2" y="2" width="36" height="36" rx="11" fill="#4338CA"/><path d="M26 15C26 11.5 23 10 20 10C16.5 10 14 12 14 15C14 18.5 18 19.5 20.5 20.3C24 21.4 26.5 22.8 26.5 26C26.5 29.3 23.5 31 20 31C16.5 31 14 29.3 13.5 26.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/><path d="M31 4.5L32.2 7.8L35.5 9L32.2 10.2L31 13.5L29.8 10.2L26.5 9L29.8 7.8Z" fill="#FBBF24"/></svg>
    <b class="lbl">S Class</b>
  </div>
  <div class="cls"><div class="clogo" id="clogo"></div><div class="ctt lbl">Lớp 10A5</div></div>
  <nav id="nav"></nav>
</aside>
<main class="mn">
  <div class="top">
    <div class="crumb">S Class / Trò chơi / <b>Trò chơi ghép nhóm</b></div>
    <div class="tools"><button class="tg" id="th" aria-label="Đổi giao diện sáng hoặc tối"><span class="k"></span></button><div class="av">PK</div></div>
  </div>
  <div class="ttl">Trò chơi ghép nhóm</div>
  <div class="grid">
    <canvas id="c"></canvas>
    <div>
      <div class="bx">
        <h5>Thiết lập</h5>
        <div class="row"><label for="n">Số ô</label><input id="n" type="range" min="3" max="15" value="5"><output id="nv">5</output></div>
        <div class="row"><label for="s">Tốc độ rơi</label><input id="s" type="range" min="0.5" max="4" step="0.5" value="1"><output id="sv">1x</output></div>
        <div class="row"><label for="sm">Vị trí thả</label><select id="sm"><option value="rand">Ngẫu nhiên</option><option value="pick">Tự chọn</option></select></div>
        <div class="row" id="pr"><label for="sx">Vị trí ngang</label><input id="sx" type="range" min="0" max="100" value="50"><output id="sxv">50%</output></div>
        <div class="btns"><button class="btn" id="go">Bắt đầu</button><button class="gh" id="reset">Xóa thống kê</button></div>
        <p id="kq"></p>
      </div>
      <div class="bx" style="margin-top:10px">
        <h5>Giao diện</h5>
        <div class="row"><label>Màu nhấn</label><div class="chips" id="pre">
          <button class="sel" data-c="#3D78C0">Xanh dương</button><button data-c="#D9653B">Hoàng hôn</button><button data-c="#2F8A63">Xanh lá</button><button data-c="#7A55C7">Tím</button>
          <input id="ac" type="color" value="#3D78C0" aria-label="Chọn màu tùy chỉnh"></div></div>
      </div>
    </div>
  </div>
</main>
</div>
<script>
const W=600,H=760,app=document.getElementById('app'),cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id),dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;
const P={cal:"M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z",grid:"M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z",award:"M12 15a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM8.2 13.9 7 22l5-3 5 3-1.2-8.1",users:"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8",clip:"M9 2h6v4H9zM15 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 14l2 2 4-4",chat:"M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12z",school:"M2 9l10-5 10 5-10 5zM6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5",dice:"M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM8 8h.01M16 8h.01M8 16h.01M16 16h.01M12 12h.01"};
const ic=k=>'<svg class="i" viewBox="0 0 24 24"><path d="'+P[k]+'"/></svg>';
$('clogo').innerHTML=ic('school');
$('nav').innerHTML=[['cal','Event'],['grid','Class Map'],['award','Class Committee'],['users','Groups'],['clip','Duty Roster'],['chat','Feedback'],['school','Teachers'],['dice','Trò chơi',1]].map(a=>'<a class="it'+(a[2]?' on':'')+'">'+ic(a[0])+'<span class="lbl">'+a[1]+'</span></a>').join('');
let n=5,speed=1,pegs=[],counts=[],ball=null,geo={},running=false,last=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const css=v=>getComputedStyle(app).getPropertyValue(v).trim();
function build(){
  const sp=W/n,binTop=H-120,top=110,bottom=binTop-45,gap=clamp(sp*.9,42,80),rows=Math.max(3,Math.floor((bottom-top)/gap)+1);
  geo={sp,binTop,r:clamp(sp*.2,5,12),pr:clamp(sp*.07,3,5)};pegs=[];
  for(let i=0;i<rows;i++){const y=top+i*gap;
    if(i%2==0)for(let k=0;k<n;k++)pegs.push({x:sp*(k+.5),y});
    else for(let k=1;k<n;k++)pegs.push({x:sp*k,y});}
  counts=new Array(n).fill(0);
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  const {sp,binTop,r,pr}=geo,tx=css('--tx'),acc=css('--acc');
  ctx.fillStyle=css('--hdr');ctx.fillRect(0,binTop,W,H-binTop);
  ctx.strokeStyle=css('--mu');ctx.lineWidth=2;
  for(let k=1;k<n;k++){ctx.beginPath();ctx.moveTo(sp*k,binTop);ctx.lineTo(sp*k,H);ctx.stroke()}
  ctx.textAlign='center';
  for(let k=0;k<n;k++){
    ctx.fillStyle=tx;ctx.font='500 '+clamp(sp*.4,14,26)+'px system-ui';ctx.fillText(k+1,sp*(k+.5),H-18);
    ctx.fillStyle=css('--mu');ctx.font=clamp(sp*.3,11,16)+'px system-ui';ctx.fillText(counts[k],sp*(k+.5),binTop+26);
  }
  ctx.fillStyle=css('--mu');
  for(const p of pegs){ctx.beginPath();ctx.arc(p.x,p.y,pr,0,7);ctx.fill()}
  ctx.fillStyle=acc;
  if(ball){ctx.beginPath();ctx.arc(ball.x,ball.y,r,0,7);ctx.fill()}
  else if($('sm').value==='pick'){
    const px=r+$('sx').value/100*(W-2*r);
    ctx.globalAlpha=.45;ctx.beginPath();ctx.arc(px,40,r,0,7);ctx.fill();ctx.globalAlpha=1;
    ctx.beginPath();ctx.moveTo(px-6,62);ctx.lineTo(px+6,62);ctx.lineTo(px,74);ctx.fill();
  }
}
function step(dt){
  const b=ball,{sp,binTop,r,pr}=geo,g=1100;
  b.vy+=g*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.y+r>binTop&&b.bin===undefined)b.bin=clamp(Math.floor(b.x/sp),0,n-1);
  if(b.bin!==undefined){
    const l=b.bin*sp+r,rr=(b.bin+1)*sp-r;
    if(b.x<l){b.x=l;b.vx=Math.abs(b.vx)*.3}
    if(b.x>rr){b.x=rr;b.vx=-Math.abs(b.vx)*.3}
    b.vx*=.98;
    if(b.y>H-r-4){b.y=H-r-4;finish()}
  }else{
    if(b.x<r){b.x=r;b.vx=Math.abs(b.vx)}
    if(b.x>W-r){b.x=W-r;b.vx=-Math.abs(b.vx)}
    for(const p of pegs){
      const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy)||.001,m=r+pr;
      if(d<m){
        b.x=p.x+dx/d*m;b.y=p.y+dy/d*m;
        if(b.last!==p){b.vx=(Math.random()<.5?-1:1)*sp*(1.2+Math.random()*.8);b.vy=Math.abs(b.vy)*.3;b.last=p}
      }
    }
  }
}
function finish(){
  counts[ball.bin]++;$('kq').innerHTML='Bi rơi vào ô số <b>'+(ball.bin+1)+'</b>';
  ball=null;running=false;setLock(false);draw();
}
function loop(t){
  if(!running)return;
  const dt=Math.min((t-last)/1000,.05);last=t;
  const sub=Math.ceil(speed*2),h=dt*speed/sub;
  for(let i=0;i<sub&&ball;i++)step(h);
  draw();if(running)requestAnimationFrame(loop);
}
function setLock(v){['n','s','sm','sx','go'].forEach(i=>$(i).disabled=v)}
$('go').onclick=()=>{
  if(running)return;
  const rr=geo.r,sx=$('sm').value==='pick'?rr+$('sx').value/100*(W-2*rr):rr+Math.random()*(W-2*rr);
  ball={x:sx+(Math.random()-.5)*2,y:40,vx:0,vy:0};
  $('kq').textContent='Bi đang rơi...';running=true;setLock(true);last=performance.now();requestAnimationFrame(loop);
};
$('reset').onclick=()=>{if(running)return;counts.fill(0);$('kq').textContent='';draw()};
$('n').oninput=e=>{n=+e.target.value;$('nv').textContent=n;build();$('kq').textContent='';draw()};
$('s').oninput=e=>{speed=+e.target.value;$('sv').textContent=speed+'x'};
function upd(){$('pr').hidden=$('sm').value!=='pick';if(!running)draw()}
$('sm').onchange=upd;
$('sx').oninput=e=>{$('sxv').textContent=e.target.value+'%';draw()};
cv.onclick=e=>{
  if(running)return;
  const b=cv.getBoundingClientRect(),v=clamp(Math.round((e.clientX-b.left)/b.width*100),0,100);
  $('sm').value='pick';$('sx').value=v;$('sxv').textContent=v+'%';upd();
};
function setAcc(c,btn){
  app.style.setProperty('--acc',c);$('ac').value=c;
  document.querySelectorAll('#pre button').forEach(b=>b.classList.toggle('sel',b===btn));draw();
}
document.querySelectorAll('#pre button').forEach(b=>b.onclick=()=>setAcc(b.dataset.c,b));
$('ac').oninput=e=>setAcc(e.target.value,null);
$('th').onclick=()=>{app.dataset.theme=app.dataset.theme==='dark'?'light':'dark';setTimeout(draw,380)};
if(matchMedia('(prefers-color-scheme:dark)').matches)app.dataset.theme='dark';
build();upd();
</script>
</body>
</html>
