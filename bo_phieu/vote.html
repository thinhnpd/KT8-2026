<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bỏ phiếu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#F3F5F9}
.app{--acc:#3D78C0;--bg:#F3F5F9;--pn:#fff;--tx:#1F2937;--mu:#6B7280;--bd:#D9DEE8;--sb:#fff;--hdr:#EDF0F6;min-height:100vh;background:var(--bg);color:var(--tx);font:14px/1.45 "Be Vietnam Pro",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .35s,color .35s}
.app[data-theme=dark]{--bg:#0E1320;--pn:#18202F;--tx:#E8EBF2;--mu:#9AA3B5;--bd:#2D3750;--sb:#131A29;--hdr:#202A3F}
button,input,textarea{font-family:inherit}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb{position:fixed;left:0;top:0;bottom:0;width:60px;background:var(--sb);border-right:.5px solid var(--bd);transition:width .25s ease,background .35s;overflow:hidden;z-index:6;white-space:nowrap;padding-top:env(safe-area-inset-top,0px)}
.sb:hover{width:244px}
.lbl{opacity:0;transition:opacity .15s}.sb:hover .lbl{opacity:1;transition:opacity .25s .08s}
.brand{display:flex;align-items:center;gap:10px;height:56px;padding:0 10px}.brand b{font-size:17px;font-weight:500}
.cls{position:relative;margin:2px 8px 10px;height:44px;border-radius:12px;overflow:hidden;background:var(--acc);transition:height .25s ease,background .35s;color:#fff}
.sb:hover .cls{height:70px}
.cls::after{content:"";position:absolute;right:-20px;top:-30px;width:90px;height:90px;border-radius:50%;background:#fff;opacity:.08}
.clogo{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;color:var(--acc);transition:all .25s}
.sb:hover .clogo{left:12px;top:12px;width:46px;height:46px;border-radius:12px}
.ctt{position:absolute;left:68px;top:24px;font-size:19px;font-weight:500}
.it{display:flex;align-items:center;gap:14px;height:40px;margin:2px 8px;padding:0 12px;border-radius:10px;color:var(--mu);text-decoration:none;transition:background .15s,color .15s}
.it:hover{background:color-mix(in srgb,var(--acc) 10%,transparent);color:var(--tx)}
.it.on{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.mn{margin-left:72px;padding:10px 16px 20px 0;max-width:1000px}
.top{display:flex;align-items:center;justify-content:space-between;height:34px}
.crumb{color:var(--mu)}.crumb b{color:var(--tx);font-weight:500}
.tools{display:flex;align-items:center;gap:14px}
.av{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500}
.tg{position:relative;width:56px;height:28px;padding:0;border:0;border-radius:14px;background:#5B9BD8;cursor:pointer;transition:background .4s}
.tg .k{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#F2C94C;transition:transform .4s,background .4s}
.app[data-theme=dark] .tg{background:#1B2338}.app[data-theme=dark] .tg .k{transform:translateX(28px);background:#CBD0DB}
.ttl{font-size:12px;letter-spacing:.6px;color:var(--mu);margin:6px 0 10px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px;align-items:start}
.bx{background:var(--pn);border:1px solid var(--bd);padding:10px 12px;margin-bottom:10px}
.bx h5{margin:0 0 8px;font-size:11.5px;font-weight:500;letter-spacing:.5px;color:var(--mu);text-transform:uppercase}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row label,.row .l{flex:0 0 96px;color:var(--mu);font-size:12px}
[hidden]{display:none!important}
textarea,input[type=number]{border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font-size:12.5px}
textarea{width:100%;padding:6px 8px;resize:vertical}
input[type=number]{height:30px;width:72px;padding:0 8px}
input[type=color]{height:30px;width:48px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);padding:2px;cursor:pointer}
.note{color:var(--mu);font-size:12px;margin-top:3px}
.err{color:#D14343;font-size:12px;min-height:16px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chips button,.gh{height:30px;padding:0 10px;border:1px solid var(--bd);border-radius:6px;background:transparent;color:var(--tx);font-size:12.5px;cursor:pointer}
.chips button.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc)}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{height:34px;padding:0 16px;border:0;border-radius:6px;background:var(--acc);color:#fff;font-size:12.5px;cursor:pointer}
button:disabled,input:disabled,textarea:disabled{opacity:.5;cursor:not-allowed}
.empty{color:var(--mu);padding:18px 0;text-align:center}
.bh{font-size:15px;font-weight:500;margin:0 0 2px}.bs{color:var(--mu);margin:0 0 10px}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cand{border:1px solid var(--bd);background:var(--bg);padding:10px}
.cand .nm{font-weight:500;margin-bottom:8px;word-break:break-word}
.cand .ctl{display:flex;align-items:center;gap:4px}
.cand .ctl button{width:30px;height:30px;border:1px solid var(--bd);border-radius:6px;background:var(--pn);color:var(--tx);font-size:16px;cursor:pointer}
.cand .ctl input{flex:1;min-width:0;width:auto;text-align:center;font-weight:600}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.win{text-align:center;padding:14px 0}.win b{display:block;font-size:22px;color:var(--acc);margin-top:4px}
.ent{border-top:1px solid var(--bd);padding:10px 0}.ent:first-child{border-top:0;padding-top:0}
.ent>b{font-weight:500;font-size:14px}
table{width:100%;border-collapse:collapse;margin:6px 0}
td{padding:4px 6px;border-bottom:1px solid var(--bd)}td:first-child{width:24px;color:var(--mu)}td:nth-child(3){text-align:right;white-space:nowrap}
.st{font-size:11.5px;padding:1px 8px;border-radius:10px;background:var(--hdr);color:var(--mu)}
.st.up{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.st.tie{background:#F2A33A33;color:#B7791F}
.msg{margin:4px 0 0;color:var(--mu)}
dialog{border:1px solid var(--bd);background:var(--pn);color:var(--tx);font:inherit;padding:16px;width:calc(100% - 32px);max-width:460px;max-height:85vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .btns{justify-content:flex-end}
.cand{display:flex;align-items:center;gap:8px}
.cand input{margin:0}
.cand .nm{margin-bottom:0}
.cand.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--bg))}
.cand.pk{cursor:pointer}
.pick{max-height:220px;overflow:auto;border:1px solid var(--bd);border-radius:6px;background:var(--bg);padding:4px 8px}
.pick label{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px;cursor:pointer}
input[type=text]{flex:1;min-width:0;height:30px;padding:0 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font-size:12.5px}
.bar{height:6px;border-radius:3px;background:var(--hdr);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.mon{margin-top:12px;padding-top:10px;border-top:1px solid var(--bd)}
.mon b{font-weight:500}
@media(max-width:760px){.grid{grid-template-columns:1fr}.sb{display:none}.mn{margin-left:0;padding:10px 12px 20px}}
</style>
<script>if(window.self!==window.top)document.documentElement.classList.add('embed')</script>
<style>
.embed .sb,.embed .top{display:none!important}
.embed .mn{margin-left:0!important;padding:0!important;max-width:none!important}
.embed .app{min-height:0!important}
.embed #thm{display:none!important}
html.embed,html.embed body,.embed .app{background:transparent!important}
</style>
</head>
<body>
<div class="app" id="app" data-theme="light">
<aside class="sb" aria-label="Menu chính">
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 40 40" style="flex:none" role="img" aria-label="Logo S Class"><rect x="2" y="2" width="36" height="36" rx="11" fill="#4338CA"/><path d="M26 15C26 11.5 23 10 20 10C16.5 10 14 12 14 15C14 18.5 18 19.5 20.5 20.3C24 21.4 26.5 22.8 26.5 26C26.5 29.3 23.5 31 20 31C16.5 31 14 29.3 13.5 26.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/><path d="M31 4.5L32.2 7.8L35.5 9L32.2 10.2L31 13.5L29.8 10.2L26.5 9L29.8 7.8Z" fill="#FBBF24"/></svg>
    <b class="lbl">S Class</b>
  </div>
  <div class="cls"><div class="clogo" id="clogo"></div><div class="ctt lbl">Lớp 10A5</div></div>
  <nav id="nav"></nav>
</aside>
<main class="mn">
  <div class="top">
    <div class="crumb">S Class / <b>Bỏ phiếu</b></div>
    <div class="tools"><button class="tg" id="th" aria-label="Đổi giao diện sáng hoặc tối"><span class="k"></span></button><div class="av">PK</div></div>
  </div>
  <h1 class="ttl" style="font-weight:400">Bỏ phiếu</h1>
  <div class="grid">
    <div>
      <div class="bx"><h5>Bảng bỏ phiếu</h5><div id="board"></div></div>
      <div class="bx" id="hbx" hidden><h5>Kết quả</h5><div id="hist"></div></div>
    </div>
    <div>
      <div class="bx" id="setup">
        <h5>Luật bỏ phiếu</h5>
        <div class="row"><label for="ttl2">Tên cuộc bầu</label><input id="ttl2" type="text" maxlength="80" autocomplete="off" placeholder="Bỏ phiếu lớp"></div>
        <div class="row" style="align-items:flex-start"><span class="l">Ứng viên</span><div style="flex:1;min-width:0">
          <div class="btns" style="margin:0 0 6px"><button class="gh" id="selAll" type="button">Chọn tất cả</button><button class="gh" id="selNone" type="button">Bỏ chọn</button></div>
          <div class="pick" id="lst" role="group" aria-label="Ứng viên"></div><div class="note" id="nn"></div></div></div>
        <div class="row"><label for="r">Số vòng</label><input id="r" type="number" min="1" max="6" value="2"></div>
        <div id="advs"></div>
        <div class="note" id="rn"></div>
        <div class="err" id="err" role="alert"></div>
        <div class="btns"><button class="btn" id="go">Bắt đầu</button></div>
      </div>
      <div class="bx" id="info" hidden>
        <h5>Cuộc bầu đang diễn ra</h5>
        <div class="row"><span class="l">Tên cuộc bầu</span><b class="nm" id="itl" style="font-weight:500"></b></div>
        <div class="row"><span class="l">Số vòng</span><span id="irn"></span></div>
        <div class="row"><span class="l">Số ứng viên</span><span id="icn"></span></div>
        <div class="btns"><button class="gh" id="cancel" type="button">Huỷ cuộc bầu</button></div>
      </div>
      <div class="bx" id="thm">
        <h5>Giao diện</h5>
        <div class="row"><span class="l">Màu nhấn</span><div class="chips" id="pre">
          <button class="sel" data-c="#3D78C0">Xanh dương</button><button data-c="#D9653B">Hoàng hôn</button><button data-c="#2F8A63">Xanh lá</button><button data-c="#7A55C7">Tím</button>
          <input id="ac" type="color" value="#3D78C0" aria-label="Chọn màu tùy chỉnh"></div></div>
      </div>
    </div>
  </div>
  <dialog id="dlg" aria-labelledby="dt"><div id="dc"></div><div class="btns"><button class="btn" id="dx">Tiếp tục</button></div></dialog>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
<script src="../js/data/supabase-config.js"></script>
<script src="../js/data/api.js"></script>
<script src="../js/data/vote-logic.js"></script>
<script src="../js/data/vote-api.js"></script>
<script>
const HUB='chia_nhom.html'; // đổi thành địa chỉ trang Chia nhóm học tập của bạn
const $=id=>document.getElementById(id),app=$('app');
const P={cal:"M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z",grid:"M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z",award:"M12 15a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM8.2 13.9 7 22l5-3 5 3-1.2-8.1",users:"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8",clip:"M9 2h6v4H9zM15 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 14l2 2 4-4",chat:"M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12z",school:"M2 9l10-5 10 5-10 5zM6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5",dice:"M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM8 8h.01M16 8h.01M8 16h.01M16 16h.01M12 12h.01",vote:"M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"};
const ic=k=>'<svg class="i" viewBox="0 0 24 24"><path d="'+P[k]+'"/></svg>';
$('clogo').innerHTML=ic('school');
$('nav').innerHTML=[['cal','Event'],['grid','Class Map'],['award','Class Committee'],['users','Groups'],['clip','Duty Roster'],['chat','Feedback'],['school','Teachers'],['dice','Chia nhóm học tập',0,HUB],['vote','Bỏ phiếu',1]].map(a=>'<a class="it'+(a[2]?' on':'')+'"'+(a[3]?' href="'+a[3]+'"':'')+'>'+ic(a[0])+'<span class="lbl">'+a[1]+'</span></a>').join('');
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const LOGIN='../auth/login.html',STUDENT='student.html';
const goTo=u=>{(window.top||window).location.replace(u)};
const NAME={};const nm=id=>NAME[id]||'?';
let ALL=[],chosen=new Set(),adv=[],lastN=-1,lastR=-1;
let E=null,EID=null,mode='setup',orphan=false,voted=false,picked=null,prog={done:0,total:0},busy=false,armed=null,tickT=null;
const R=()=>Math.max(1,Math.min(6,Math.floor(+$('r').value)||1));
const ids=()=>ALL.filter(s=>chosen.has(s.id)).map(s=>s.id);

/* ---------- Luật (trước khi bắt đầu) ---------- */
function renderAdv(){
  const r=R(),box=$('advs');box.textContent='';
  $('rn').textContent=r===1?'Một vòng: ứng viên nhiều phiếu nhất thắng cuộc.':'Vòng '+r+' (vòng cuối) luôn còn đúng 2 ứng viên để bỏ phiếu 50/50.';
  for(let k=0;k<r-1;k++){
    const row=el('div','row'),l=el('label','','Sau vòng '+(k+1)),i=el('input');
    i.type='number';i.min=2;i.value=adv[k];i.id='a'+k;l.htmlFor=i.id;
    if(k===r-2)i.disabled=true;
    i.oninput=()=>{adv[k]=+i.value;check()};
    row.append(l,i,el('span','note','người đi tiếp'));box.appendChild(row);
  }
}
function check(){
  const msg=VoteLogic.validate(chosen.size,R(),adv);
  $('err').textContent=$('err').dataset.keep||msg;$('go').disabled=!!msg||busy;return !msg;
}
function sync(){
  $('nn').textContent=chosen.size+' ứng viên (tối đa '+ALL.length+')';
  if(chosen.size!==lastN||R()!==lastR){lastN=chosen.size;lastR=R();adv=VoteLogic.defAdv(chosen.size,R());renderAdv()}
  check();
}
function buildList(){
  const box=$('lst');box.textContent='';
  ALL.forEach(s=>{
    const l=el('label'),c=el('input');c.type='checkbox';c.checked=chosen.has(s.id);
    c.onchange=()=>{c.checked?chosen.add(s.id):chosen.delete(s.id);$('err').dataset.keep='';sync()};
    l.append(c,el('span','nm',s.name));box.appendChild(l);
  });
}
$('selAll').onclick=()=>{ALL.forEach(s=>chosen.add(s.id));buildList();sync()};
$('selNone').onclick=()=>{chosen.clear();buildList();sync()};
$('r').oninput=()=>{$('err').dataset.keep='';sync()};

/* ---------- Hiển thị ---------- */
function entryEl(e){
  const d=el('div','ent'),t=el('table');d.appendChild(el('b','',e.title));
  e.rows.forEach((r,k)=>{
    const tr=el('tr'),c=el('td');c.appendChild(el('span','st'+(r.cls?' '+r.cls:''),r.status));
    tr.append(el('td','',k+1),el('td','nm',r.name),el('td','',r.votes+' phiếu'),c);t.appendChild(tr);
  });
  d.append(t,el('p','msg',e.msg));return d;
}
function renderHist(){
  const h=(E&&E.hist)||[];$('hbx').hidden=!h.length;$('hist').textContent='';
  h.forEach(e=>$('hist').appendChild(entryEl(e)));
}
function renderSide(){
  const act=mode==='active';
  $('setup').hidden=act;$('info').hidden=!act;
  if(act&&E){$('itl').textContent=E.title||'';$('irn').textContent=E.R;$('icn').textContent=E.cands.length}
}
function updateProg(){
  const p=$('prog'),b=$('pbar');if(!p)return;
  p.textContent='Đã bỏ phiếu: '+prog.done+'/'+prog.total;
  if(b)b.style.width=(prog.total?Math.min(100,Math.round(prog.done/prog.total*100)):0)+'%';
  const e=$('end');if(e&&!armed)e.disabled=busy||prog.done===0;
}
function renderBoard(){
  const b=$('board');b.textContent='';
  if(mode==='done'&&E&&E.done){const w=el('div','win','Người thắng cuộc');w.appendChild(el('b','nm',nm(E.winner)));b.appendChild(w);return}
  if(mode==='setup'){b.appendChild(el('div','empty','Thiết lập luật bên phải rồi nhấn "Bắt đầu".'));return}
  if(orphan||!E||!E.cur){
    b.appendChild(el('div','err','Cuộc bầu bị lỗi: không có vòng nào đang mở. Hãy huỷ cuộc bầu rồi tạo lại.'));return}
  const c=E.cur,fin=E.idx===E.R-1;
  b.append(el('p','bh',c.kind==='mini'?'Vòng phụ (thuộc vòng '+(E.idx+1)+')':'Vòng '+(E.idx+1)+'/'+E.R+(fin?' · vòng cuối':'')),
    el('p','bs',c.kind==='mini'?'Chọn '+c.need+' người trong '+c.ids.length+' người đồng điểm.':fin?'Chọn 1 người thắng cuộc.':'Chọn '+c.need+' người đi tiếp.'));
  /* Admin bỏ phiếu như mọi tài khoản khác: một phiếu, không sửa được, không nhập số phiếu */
  const g=el('div','cands');
  c.ids.forEach(id=>{
    const d=el('label','cand'+(voted?'':' pk')+(picked===id?' sel':''));
    if(!voted){
      const r=el('input');r.type='radio';r.name='mine';r.value=id;r.checked=picked===id;
      r.onchange=()=>{picked=id;g.querySelectorAll('.cand').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');$('send').disabled=busy};
      d.appendChild(r);
    }
    d.appendChild(el('span','nm',nm(id)));g.appendChild(d);
  });
  const mon=el('div','mon'),pr=el('div','');pr.id='prog';pr.style.fontWeight='500';
  const bar=el('div','bar'),bi=el('i');bi.id='pbar';bar.appendChild(bi);
  mon.append(pr,bar,el('p','note','Số phiếu từng ứng viên chỉ hiện sau khi kết thúc vòng. Admin chỉ bỏ phiếu cho chính mình, không nhập số phiếu.'));
  const f=el('div','foot'),t=el('span','note',voted?'Bạn đã bỏ phiếu ở vòng này.':'Bạn chưa bỏ phiếu. Chọn một ứng viên rồi gửi phiếu.'),acts=el('span','btns');
  acts.style.margin='0';
  if(!voted){const s=el('button','btn','Gửi phiếu của tôi');s.id='send';s.disabled=picked===null||busy;s.onclick=sendMine;acts.appendChild(s)}
  const e=el('button',voted?'btn':'gh','Kết thúc vòng');e.id='end';e.onclick=endRound;acts.appendChild(e);
  f.append(t,acts);b.append(g,mon,f);updateProg();
}
function render(){renderSide();renderBoard();renderHist();if(mode==='setup')sync()}
function announce(e,w){
  const dc=$('dc');dc.textContent='';
  const h=el('h2','',w!==null?'Kết quả cuối cùng':'Kết quả vừa công bố');h.id='dt';h.style.cssText='margin:0 0 10px;font-size:16px;font-weight:500';
  dc.appendChild(h);
  if(w!==null){const x=el('div','win','Người thắng cuộc');x.appendChild(el('b','nm',nm(w)));dc.appendChild(x)}
  dc.appendChild(entryEl(e));
  if(!$('dlg').open)$('dlg').showModal();
}
$('dx').onclick=()=>$('dlg').close();

/* ---------- Thao tác ---------- */
function fail(msg){const e=$('err');e.dataset.keep=msg;e.textContent=msg}
function toastErr(m){const e=$('err');if(!$('setup').hidden){fail(m);return}
  const b=$('board'),x=el('div','err',m);b.appendChild(x);setTimeout(()=>x.remove(),5000)}
async function refreshProg(){
  if(!E||!E.cur||!E.cur.roundId){prog={done:0,total:0};return}
  try{prog=await VoteAPI.progress(E.cur.roundId)}catch(e){}
}
async function load(){
  const cur=await VoteAPI.current();
  orphan=false;voted=false;picked=null;armed=null;
  if(cur){
    mode='active';EID=cur.election.id;E=cur.election.state||null;
    if(!E||!E.cur||!cur.round)orphan=true;
    else E.cur.roundId=cur.round.id;   // vòng đang mở trong cơ sở dữ liệu là nguồn đúng
    if(E&&!E.title)E.title=cur.election.title;
    if(!orphan){voted=await VoteAPI.voted(E.cur.roundId);await refreshProg()}
  }else{
    const f=await VoteAPI.lastFinished();
    if(f){mode='done';E=f.state}else{mode='setup';E=null}
    EID=null;
  }
  render();
}
async function sendMine(){
  if(busy||picked===null)return;busy=true;$('send').disabled=true;
  try{await VoteAPI.cast(E.cur.roundId,picked);voted=true}
  catch(e){if(e.message==='already_voted')voted=true;else{toastErr('Không gửi được phiếu. Hãy thử lại.');busy=false;$('send').disabled=false;return}}
  busy=false;picked=null;await refreshProg();renderBoard();
}
function arm(btn,txt,fn){   // bấm hai lần để chắc chắn (tránh bấm nhầm)
  if(armed===btn.id){armed=null;fn();return}
  armed=btn.id;const old=btn.textContent;btn.textContent=txt;btn.disabled=false;
  setTimeout(()=>{if(armed===btn.id){armed=null;btn.textContent=old;updateProg()}},4000);
}
function endRound(){
  const b=$('end');if(busy||prog.done===0)return;
  arm(b,'Bấm lần nữa để kết thúc vòng',async()=>{
    busy=true;b.disabled=true;
    try{
      const res=await VoteAPI.endRound(EID,E,nm);
      E=res.state;picked=null;voted=false;
      if(E.done)mode='done';else await refreshProg();
      busy=false;render();announce(res.entry,E.done?E.winner:null);
    }catch(e){console.error('[vote] endRound',e);busy=false;toastErr('Không thực hiện được. Đang tải lại trạng thái.');try{await load()}catch(x){}}
  });
}
$('cancel').onclick=()=>{
  const b=$('cancel');if(busy)return;
  arm(b,'Bấm lần nữa để huỷ',async()=>{
    busy=true;
    try{await VoteAPI.cancel(EID,E);E=null;EID=null;mode='setup';orphan=false;busy=false;render()}
    catch(e){console.error('[vote] cancel',e);busy=false;toastErr('Không huỷ được. Hãy thử lại.')}
  });
};
$('go').onclick=async()=>{
  if(!check()||busy)return;busy=true;$('go').disabled=true;
  const title=$('ttl2').value.trim()||'Bỏ phiếu lớp';
  const st=VoteLogic.start(ids(),R(),adv);st.title=title;
  try{
    const r=await VoteAPI.begin(title,st);
    E=r.state;EID=r.electionId;mode='active';orphan=false;voted=false;picked=null;busy=false;
    await refreshProg();render();
  }catch(e){
    console.error('[vote] begin',e);busy=false;
    if(e.message==='already_open'){fail('Đang có một cuộc bỏ phiếu khác đang mở. Đã tải lại.');await load()}
    else{fail('Không bắt đầu được. Hãy thử lại.');check()}
  }
};
async function tick(){   // theo dõi: số người đã bỏ phiếu, và phát hiện admin khác đã đổi vòng / huỷ cuộc bầu
  if(busy||mode!=='active'||orphan)return;
  try{
    const cur=await VoteAPI.current();
    if(!cur||!cur.round||!E||!E.cur||cur.round.id!==E.cur.roundId){await load();return}
    await refreshProg();updateProg();
  }catch(e){}
}

/* ---------- Khởi động: chỉ admin mới dùng được trang này ---------- */
(async function init(){
  try{
    const m=await VoteAPI.me();
    if(!m){goTo(LOGIN);return}
    if(m.role!=='admin'){goTo(STUDENT);return}
    ALL=await VoteAPI.students();ALL.forEach(s=>NAME[s.id]=s.name);
    buildList();
    await load();
    tickT=VoteAPI.watch(tick,4000);
  }catch(e){
    console.error('[vote] init',e);
    $('board').textContent='';$('board').appendChild(el('div','err','Không tải được dữ liệu bỏ phiếu. Vui lòng tải lại trang.'));
  }
})();
function setAcc(c,btn){app.style.setProperty('--acc',c);$('ac').value=c;document.querySelectorAll('#pre button').forEach(b=>b.classList.toggle('sel',b===btn))}
document.querySelectorAll('#pre button').forEach(b=>b.onclick=()=>setAcc(b.dataset.c,b));
$('ac').oninput=e=>setAcc(e.target.value,null);
$('th').onclick=()=>{app.dataset.theme=app.dataset.theme==='dark'?'light':'dark'};
if(matchMedia('(prefers-color-scheme:dark)').matches)app.dataset.theme='dark';
if(window.self!==window.top){try{
  const root=parent.document.documentElement;
  const syncTheme=()=>{
    const cs=parent.getComputedStyle(root);
  ['--acc','--bg','--pn','--tx','--mu','--bd','--hdr'].forEach(v=>{
      const x=cs.getPropertyValue(v).trim();if(x)app.style.setProperty(v,x);
    });
    app.dataset.theme=cs.colorScheme==='dark'?'dark':'light';
    document.documentElement.style.colorScheme=app.dataset.theme;
  };
  syncTheme();
  new parent.MutationObserver(syncTheme).observe(root,{attributes:true,attributeFilter:['data-theme','style','class']});
  parent.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',syncTheme);
}catch(e){}}
</script>
