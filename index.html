        <button class="tg" id="tg" aria-label="Đổi giao diện sáng hoặc tối" aria-pressed="false"><span class="st" style="left:8px;top:7px"></span><span class="st" style="left:15px;top:16px"></span><span class="st" style="left:22px;top:6px"></span><span class="cl"></span><span class="k"></span></button>

          <div class="dd" id="avDd" hidden></div>
        </div>
