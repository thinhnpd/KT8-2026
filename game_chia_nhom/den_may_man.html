<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đèn may mắn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#F3F5F9}
.app{--acc:#3D78C0;--bg:#F3F5F9;--pn:#fff;--tx:#1F2937;--mu:#6B7280;--bd:#D9DEE8;--sb:#fff;--hdr:#EDF0F6;min-height:100vh;background:var(--bg);color:var(--tx);font:14px/1.45 "Be Vietnam Pro",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .35s,color .35s}
.app[data-theme=dark]{--bg:#0E1320;--pn:#18202F;--tx:#E8EBF2;--mu:#9AA3B5;--bd:#2D3750;--sb:#131A29;--hdr:#202A3F}
button,input,select,textarea{font-family:inherit}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb{position:fixed;left:0;top:0;bottom:0;width:60px;background:var(--sb);border-right:.5px solid var(--bd);transition:width .25s ease,background .35s;overflow:hidden;z-index:6;white-space:nowrap;padding-top:env(safe-area-inset-top,0px)}
.sb:hover{width:244px}
.lbl{opacity:0;transition:opacity .15s}.sb:hover .lbl{opacity:1;transition:opacity .25s .08s}
.brand{display:flex;align-items:center;gap:10px;height:56px;padding:0 10px}.brand b{font-size:17px;font-weight:500}
.cls{position:relative;margin:2px 8px 10px;height:44px;border-radius:12px;overflow:hidden;background:var(--acc);transition:height .25s ease,background .35s;color:#fff}
.sb:hover .cls{height:70px}
.cls::after{content:"";position:absolute;right:-20px;top:-30px;width:90px;height:90px;border-radius:50%;background:#fff;opacity:.08}
.clogo{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;color:var(--acc);transition:all .25s}
.sb:hover .clogo{left:12px;top:12px;width:46px;height:46px;border-radius:12px}
.ctt{position:absolute;left:68px;top:24px;font-size:19px;font-weight:500}
.it{display:flex;align-items:center;gap:14px;height:40px;margin:2px 8px;padding:0 12px;border-radius:10px;color:var(--mu);cursor:pointer;transition:background .15s,color .15s}
.it:hover{background:color-mix(in srgb,var(--acc) 10%,transparent);color:var(--tx)}
.it.on{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.mn{margin-left:72px;padding:10px 16px 20px 0;max-width:1000px}
.top{display:flex;align-items:center;justify-content:space-between;height:34px}
.crumb{color:var(--mu)}.crumb b{color:var(--tx);font-weight:500}
.tools{display:flex;align-items:center;gap:14px;color:var(--mu)}
.av{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500}
.tg{position:relative;width:56px;height:28px;padding:0;border:0;border-radius:14px;background:#5B9BD8;cursor:pointer;transition:background .4s}
.tg .k{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#F2C94C;transition:transform .4s,background .4s}
.app[data-theme=dark] .tg{background:#1B2338}.app[data-theme=dark] .tg .k{transform:translateX(28px);background:#CBD0DB}
.ttl{font-size:12px;letter-spacing:.6px;color:var(--mu);margin:6px 0 10px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px;align-items:start}
.bx{background:var(--pn);border:1px solid var(--bd);padding:10px 12px}
.bx h5{margin:0 0 8px;font-size:11.5px;font-weight:500;letter-spacing:.5px;color:var(--mu);text-transform:uppercase}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row label{flex:0 0 96px;color:var(--mu);font-size:12px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--acc)}
.row output{flex:0 0 40px;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
input[type=color]{height:30px;width:48px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);padding:2px;cursor:pointer}
textarea{width:100%;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);padding:6px 8px;font-size:12.5px;resize:vertical}
.note{color:var(--mu);font-size:12px;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chips button,.gh{height:30px;padding:0 10px;border:1px solid var(--bd);border-radius:6px;background:transparent;color:var(--tx);font-size:12.5px;cursor:pointer}
.chips button.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc)}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{height:34px;padding:0 16px;border:0;border-radius:6px;background:var(--acc);color:#fff;font-size:12.5px;cursor:pointer}
button:disabled,input:disabled,textarea:disabled{opacity:.5;cursor:not-allowed}
#kq{margin:12px 0 0;min-height:20px;color:var(--mu);font-size:12.5px}
#kq b{color:var(--acc);font-weight:600}
#lamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.lamp{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border:1px solid var(--bd);background:var(--bg)}
.bulb{width:46px;height:46px;border-radius:50%;background:var(--hdr);border:2px solid var(--bd);transition:background .08s,box-shadow .08s,border-color .08s}
.nm{color:var(--mu);text-align:center;font-size:12.5px;word-break:break-word}
.lamp.on{background:var(--pn);border-color:var(--acc)}
.lamp.on .bulb{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 25%,transparent),0 0 22px var(--acc)}
.lamp.on .nm{color:var(--tx);font-weight:500}
.lamp.win .bulb{animation:bl .6s ease-in-out infinite alternate}
@keyframes bl{to{box-shadow:0 0 0 8px color-mix(in srgb,var(--acc) 35%,transparent),0 0 34px var(--acc)}}
@media(prefers-reduced-motion:reduce){.lamp.win .bulb{animation:none}}
#hist{margin:0;padding-left:18px;color:var(--mu);font-size:12.5px}
[hidden]{display:none!important}
select,input[type=number]{flex:1;min-width:0;height:30px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);padding:0 8px;font-size:12.5px}
select:disabled,input[type=number]:disabled{opacity:.5;cursor:not-allowed}
.lamp.on.g{border-color:var(--gc)}
.lamp.on.g .bulb{background:var(--gc);border-color:var(--gc);box-shadow:0 0 0 4px color-mix(in srgb,var(--gc) 25%,transparent),0 0 22px var(--gc)}
.gb{border:1px solid var(--bd);border-left:4px solid var(--gc);background:var(--bg);padding:6px 10px;margin-bottom:6px}
.gc{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mu)}.gc input[type=color]{width:36px;height:26px}
.gb b{font-weight:500}.gb div{color:var(--mu);font-size:12.5px;margin-top:2px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.sb{display:none}.mn{margin-left:0;padding:10px 12px 20px}}
</style>
<script>if(window.self!==window.top)document.documentElement.classList.add('embed')</script>
<style>
.embed .sb,.embed .top{display:none!important}
.embed .mn{margin-left:0!important;padding:0!important;max-width:none!important}
.embed .app{min-height:0!important}
.embed #thm{display:none!important}
html.embed,html.embed body,.embed .app{background:transparent!important}
</style>
</head>
<body>
<div class="app" id="app" data-theme="light">
<aside class="sb" aria-label="Menu chính">
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 40 40" style="flex:none" role="img" aria-label="Logo S Class"><rect x="2" y="2" width="36" height="36" rx="11" fill="#4338CA"/><path d="M26 15C26 11.5 23 10 20 10C16.5 10 14 12 14 15C14 18.5 18 19.5 20.5 20.3C24 21.4 26.5 22.8 26.5 26C26.5 29.3 23.5 31 20 31C16.5 31 14 29.3 13.5 26.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/><path d="M31 4.5L32.2 7.8L35.5 9L32.2 10.2L31 13.5L29.8 10.2L26.5 9L29.8 7.8Z" fill="#FBBF24"/></svg>
    <b class="lbl">S Class</b>
  </div>
  <div class="cls"><div class="clogo" id="clogo"></div><div class="ctt lbl">Lớp 10A5</div></div>
  <nav id="nav"></nav>
</aside>
<main class="mn">
  <div class="top">
    <div class="crumb">S Class / Chia nhóm học tập / <b>Đèn may mắn</b></div>
    <div class="tools"><button class="tg" id="th" aria-label="Đổi giao diện sáng hoặc tối"><span class="k"></span></button><div class="av">PK</div></div>
  </div>
  <div class="ttl">Đèn may mắn</div>
  <div class="grid">
    <div><div class="bx"><h5>Bảng đèn</h5><div id="lamps"></div></div><div class="bx" id="gres" hidden style="margin-top:10px"><h5>Kết quả chia nhóm</h5><div id="gout"></div></div></div>
    <div>
      <div class="bx">
        <h5>Thiết lập</h5>
        <div class="row"><label for="md">Chế độ</label><select id="md"><option value="one">Chọn một ô</option><option value="grp">Chia nhóm</option></select></div>
        <div class="row" id="gr" hidden><label for="g">Số nhóm</label><input id="g" type="number" min="2" max="12" value="4"></div>
        <div class="row" id="gcr" hidden style="align-items:flex-start"><label>Màu từng nhóm</label><div class="chips" id="gcs"></div></div>
        <div class="row" id="sjr" hidden><label for="sj">Môn học</label><select id="sj"></select></div>
        <div class="note" id="sjn" hidden></div>
        <div class="row" style="align-items:flex-start"><label for="lst" id="ll">Danh sách ô<br>(mỗi dòng một ô)</label><div style="flex:1;min-width:0"><textarea id="lst" rows="5">Tổ 1
Tổ 2
Tổ 3
Tổ 4
Tổ 5</textarea><div class="note" id="nn"></div><button type="button" class="gh" id="useCls" hidden style="margin-top:6px">Dùng danh sách lớp</button></div></div>
        <div class="row"><label for="d">Thời gian quay</label><input id="d" type="range" min="2" max="10" value="5"><output id="dv">5s</output></div>
        <div class="btns"><button class="btn" id="go">Quay</button><button class="gh" hidden id="reset">Xóa lịch sử</button></div>
        <p id="kq"></p>
      </div>
      <div class="bx" id="thm" style="margin-top:10px">
        <h5>Giao diện</h5>
        <div class="row"><label>Màu nhấn</label><div class="chips" id="pre">
          <button class="sel" data-c="#3D78C0">Xanh dương</button><button data-c="#D9653B">Hoàng hôn</button><button data-c="#2F8A63">Xanh lá</button><button data-c="#7A55C7">Tím</button>
          <input id="ac" type="color" value="#3D78C0" aria-label="Chọn màu tùy chỉnh"></div></div>
      </div>
      <div class="bx" hidden style="margin-top:10px"><h5>Lịch sử</h5><ol id="hist"></ol><div class="note" id="he">Chưa có lượt quay nào</div></div>
    </div>
  </div>
</main>
</div>
<script>
const $=id=>document.getElementById(id),app=$('app');
const P={cal:"M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z",grid:"M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z",award:"M12 15a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM8.2 13.9 7 22l5-3 5 3-1.2-8.1",users:"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8",clip:"M9 2h6v4H9zM15 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 14l2 2 4-4",chat:"M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12z",school:"M2 9l10-5 10 5-10 5zM6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5",dice:"M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM8 8h.01M16 8h.01M8 16h.01M16 16h.01M12 12h.01",bulb:"M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"};
const ic=k=>'<svg class="i" viewBox="0 0 24 24"><path d="'+P[k]+'"/></svg>';
$('clogo').innerHTML=ic('school');
$('nav').innerHTML=[['cal','Event'],['grid','Class Map'],['award','Class Committee'],['users','Groups'],['clip','Duty Roster'],['chat','Feedback'],['school','Teachers'],['dice','Chia nhóm học tập']].map(a=>'<a class="it'+(a[2]?' on':'')+'">'+ic(a[0])+'<span class="lbl">'+a[1]+'</span></a>').join('');
let labels=[],lamps=[],cur=-1,running=false,hist=[];
function readListOld(){
  const l=$('lst').value.split('\n').map(s=>s.trim()).filter(Boolean),ok=l.length>=2;
  if(ok)labels=l.slice(0,24);
  $('nn').textContent=ok?(l.length>24?'Tối đa 24 ô, chỉ dùng 24 dòng đầu':labels.length+' ô'):'Cần ít nhất 2 dòng';
  $('go').disabled=!ok;return ok;
}
function render(){
  const box=$('lamps');box.textContent='';cur=-1;
  lamps=labels.map(t=>{
    const d=document.createElement('div'),b=document.createElement('div'),s=document.createElement('div');
    d.className='lamp';b.className='bulb';s.className='nm';s.textContent=t;d.append(b,s);box.appendChild(d);return d;
  });
}
function setOn(i){lamps.forEach((l,k)=>{l.classList.toggle('on',k===i);l.classList.remove('win')})}
function setLock(v){['lst','d','go','md','g','sj'].forEach(i=>$(i).disabled=v);document.querySelectorAll('#gcs input').forEach(x=>x.disabled=v)}
function showHist(){
  const ol=$('hist');ol.textContent='';
  hist.slice(-8).reverse().forEach(t=>{const li=document.createElement('li');li.textContent=t;ol.appendChild(li)});
  $('he').hidden=hist.length>0;
}
function spin(){
  if(running)return;
  if($('md').value==='grp')return spinGroups();
  running=true;setLock(true);setOn(-1);cur=-1;$('kq').textContent='Đang quay...';
  const dur=+$('d').value*1000,t0=performance.now();
  (function tick(){
    let nx;do{nx=Math.floor(Math.random()*labels.length)}while(nx===cur);
    cur=nx;setOn(cur);
    const e=(performance.now()-t0)/dur;
    if(e>=1){
      lamps[cur].classList.add('win');
      const kq=$('kq'),b=document.createElement('b');kq.textContent='Đèn sáng ở ô ';b.textContent=labels[cur];kq.appendChild(b);
      hist.push(labels[cur]);showHist();running=false;setLock(false);return;
    }
    setTimeout(tick,60+Math.pow(e,3)*420);
  })();
}
const GC=[['Đỏ','#E5484D'],['Xanh dương','#3D78C0'],['Xanh lá','#2F8A63'],['Cam','#F2A33A'],['Tím','#7A55C7'],['Xanh ngọc','#14A3B8'],['Cam đất','#C2561F'],['Hồng','#D6409F'],['Xanh rêu','#6B8E23'],['Nâu','#8A6D3B'],['Chàm','#4F5BD5'],['Lục bảo','#0E9F6E']];
let gcols=GC.map(x=>x[1]);
function readList(){
  const grp=$('md').value==='grp',max=60,unit=grp?'người':'ô',l=$('lst').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const g=Math.floor(+$('g').value);let ok=l.length>=2,msg='Cần ít nhất 2 dòng';
  if(grp&&!(g>=2&&g<=12)){ok=false;msg='Số nhóm phải từ 2 đến 12'}
  else if(grp&&l.length<g){ok=false;msg='Cần ít nhất '+g+' người cho '+g+' nhóm'}
  else if(grp&&new Set(gcols.slice(0,g).map(c=>c.toLowerCase())).size<g){ok=false;msg='Có nhóm trùng màu, hãy chọn màu khác nhau'}
  if(ok){
    labels=l.slice(0,max);const m=labels.length;
    msg=m+' '+unit+(l.length>max?' (chỉ dùng '+max+' dòng đầu)':'');
    if(grp)msg+=' · mỗi nhóm '+(m%g?Math.floor(m/g)+'–'+Math.ceil(m/g):m/g)+' người';
  }
  $('nn').textContent=msg;$('go').disabled=!ok;return ok;
}
function showGroups(g,fin){
  const out=$('gout');out.textContent='';
  for(let c=0;c<g;c++){
    const mem=labels.filter((_,i)=>fin[i]===c),d=document.createElement('div'),h=document.createElement('b'),p=document.createElement('div');
    d.className='gb';d.style.setProperty('--gc',gcols[c]);
    h.textContent='Nhóm '+(c+1)+' · '+(GC.find(x=>x[1].toLowerCase()===gcols[c].toLowerCase())||[gcols[c]])[0]+' ('+mem.length+' người)';p.textContent=mem.join(', ');
    d.append(h,p);out.appendChild(d);
  }
  $('gres').hidden=false;$('kq').textContent='Đã chia '+labels.length+' người thành '+g+' nhóm.';
  /* Gửi kết quả cho trang chủ để lưu theo môn (chỉ khi được nhúng trong iframe) */
  try{if(parent!==window){var gp=[];for(var c2=0;c2<g;c2++)gp.push({no:c2+1,color:gcols[c2],members:labels.filter(function(_,i){return fin[i]===c2})});
    parent.postMessage({type:'groups:done',method:'lights',subject:$('sj').value||undefined,groups:gp},location.origin)}}catch(e){}
}
function spinGroups(){
  const g=Math.floor(+$('g').value),m=labels.length,dur=+$('d').value*1000,t0=performance.now();
  running=true;setLock(true);setOn(-1);$('gres').hidden=true;$('kq').textContent='Đang chia nhóm...';
  const idx=labels.map((_,i)=>i);
  for(let i=m-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
  const fin=[];idx.forEach((mi,p)=>fin[mi]=p%g);   // chia vòng tròn: chênh lệch tối đa 1 người
  const cols=new Array(m).fill(-1);
  const paint=(i,c)=>{cols[i]=c;lamps[i].style.setProperty('--gc',gcols[c]);lamps[i].classList.add('on','g')};
  function reveal(){
    for(let i=0;i<m;i++)setTimeout(()=>paint(i,fin[i]),i*50);
    setTimeout(()=>{showGroups(g,fin);running=false;setLock(false)},m*50+250);
  }
  (function tick(){
    const e=(performance.now()-t0)/dur;
    if(e>=1)return reveal();
    for(let i=0;i<m;i++){let c;do{c=Math.floor(Math.random()*g)}while(c===cols[i]);paint(i,c)}
    setTimeout(tick,80+Math.pow(e,3)*300);
  })();
}
function buildGC(){
  const g=Math.floor(+$('g').value),box=$('gcs');box.textContent='';
  if(!(g>=2&&g<=12))return;
  for(let k=0;k<g;k++){
    const w=document.createElement('span'),t=document.createElement('span'),i=document.createElement('input');
    w.className='gc';t.textContent='Nhóm '+(k+1);i.type='color';i.value=gcols[k];i.setAttribute('aria-label','Màu nhóm '+(k+1));
    i.oninput=()=>{gcols[k]=i.value;readList()};w.append(t,i);box.appendChild(w);
  }
}
$('g').oninput=()=>{buildGC();readList();$('gres').hidden=true};
$('md').onchange=()=>{
  const grp=$('md').value==='grp';
  $('gr').hidden=!grp;$('gcr').hidden=!grp;buildGC();$('gres').hidden=true;
  $('ll').innerHTML=grp?'Danh sách thành viên<br>(mỗi dòng một người)':'Danh sách ô<br>(mỗi dòng một ô)';
  $('d').value=grp?10:5;$('dv').textContent=$('d').value+'s';$('kq').textContent='';
  if(readList())render();
};
$('go').onclick=spin;
$('reset').onclick=()=>{if(running)return;hist=[];showHist();$('kq').textContent=''};
$('d').oninput=e=>$('dv').textContent=e.target.value+'s';
$('lst').oninput=()=>{if(readList()){render();hist=[];showHist();$('kq').textContent=''}};
function setAcc(c,btn){
  app.style.setProperty('--acc',c);$('ac').value=c;
  document.querySelectorAll('#pre button').forEach(b=>b.classList.toggle('sel',b===btn));
}
document.querySelectorAll('#pre button').forEach(b=>b.onclick=()=>setAcc(b.dataset.c,b));
$('ac').oninput=e=>setAcc(e.target.value,null);
$('th').onclick=()=>{app.dataset.theme=app.dataset.theme==='dark'?'light':'dark'};
if(matchMedia('(prefers-color-scheme:dark)').matches)app.dataset.theme='dark';
readList();render();showHist();
/* Khi chạy trong trang chủ: nút điền sẵn danh sách học sinh của lớp */
try{if(parent!==window&&parent.C&&parent.C.students){
  var pr=parent,fillCls=function(){$('lst').value=pr.C.students.join('\n');$('lst').dispatchEvent(new Event('input'))};
  $('useCls').hidden=false;$('useCls').onclick=fillCls;
  $('md').value='grp';$('md').dispatchEvent(new Event('change'));fillCls();   /* mặc định: chia nhóm bằng danh sách lớp từ CSDL */
  if(pr.admin&&pr.admin()&&pr.GSUBJ){
    $('sj').innerHTML=pr.GSUBJ.map(function(s){return '<option value="'+s.c+'">'+s.vi+'</option>'}).join('');$('sjr').hidden=false;
    var svd=null,sjNote=function(){var s=svd&&svd[$('sj').value],n=$('sjn');n.hidden=!s;if(s)n.textContent='Môn này đã có bộ nhóm ('+s.groups.length+' nhóm). Lưu bộ mới sẽ thay thế bộ cũ.'};
    $('sj').onchange=sjNote;pr.API.loadGroups().then(function(r){svd=r;sjNote()}).catch(function(){});
  }
}}catch(e){}
/* Đồng bộ giao diện với trang chủ khi được nhúng */
if(window.self!==window.top){try{
  const root=parent.document.documentElement;
  const sync=()=>{
    const cs=parent.getComputedStyle(root);
    ['--acc','--bg','--pn','--tx','--mu','--bd','--hdr'].forEach(v=>{
      const x=cs.getPropertyValue(v).trim();if(x)app.style.setProperty(v,x);
    });
    app.dataset.theme=cs.colorScheme==='dark'?'dark':'light';
    document.documentElement.style.colorScheme=app.dataset.theme;
    if(typeof draw==='function')draw();
  };
  sync();
  new parent.MutationObserver(sync).observe(root,{attributes:true,attributeFilter:['data-theme','style','class']});
  parent.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',sync);
}catch(e){}}
</script>
<script src="../js/i18n/embed-i18n.js"></script>
<script src="../js/i18n/en-embed.js"></script>
</body>
</html>
