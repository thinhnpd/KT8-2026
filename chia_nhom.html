<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chia nhóm học tập · S Class</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#F3F5F9}
.app{--acc:#3D78C0;--bg:#F3F5F9;--pn:#fff;--tx:#1F2937;--mu:#6B7280;--bd:#D9DEE8;--sb:#fff;--hdr:#EDF0F6;min-height:100vh;background:var(--bg);color:var(--tx);font:13px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .35s,color .35s}
.app[data-theme=dark]{--bg:#0E1320;--pn:#18202F;--tx:#E8EBF2;--mu:#9AA3B5;--bd:#2D3750;--sb:#131A29;--hdr:#202A3F}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb{position:fixed;left:0;top:0;bottom:0;width:60px;background:var(--sb);border-right:.5px solid var(--bd);transition:width .25s ease,background .35s;overflow:hidden;z-index:6;white-space:nowrap;padding-top:env(safe-area-inset-top,0px)}
.sb:hover{width:244px}
.lbl{opacity:0;transition:opacity .15s}.sb:hover .lbl{opacity:1;transition:opacity .25s .08s}
.brand{display:flex;align-items:center;gap:10px;height:56px;padding:0 10px}.brand b{font-size:17px;font-weight:500}
.cls{position:relative;margin:2px 8px 10px;height:44px;border-radius:12px;overflow:hidden;background:var(--acc);transition:height .25s ease,background .35s;color:#fff}
.sb:hover .cls{height:70px}
.cls::after{content:"";position:absolute;right:-20px;top:-30px;width:90px;height:90px;border-radius:50%;background:#fff;opacity:.08}
.clogo{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;color:var(--acc);transition:all .25s}
.sb:hover .clogo{left:12px;top:12px;width:46px;height:46px;border-radius:12px}
.ctt{position:absolute;left:68px;top:24px;font-size:19px;font-weight:500}
.it{display:flex;align-items:center;gap:14px;height:40px;margin:2px 8px;padding:0 12px;border-radius:10px;color:var(--mu);text-decoration:none;transition:background .15s,color .15s}
.it:hover{background:color-mix(in srgb,var(--acc) 10%,transparent);color:var(--tx)}
.it.on{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.mn{margin-left:72px;padding:10px 16px 20px 0;max-width:1000px}
.top{display:flex;align-items:center;justify-content:space-between;height:34px}
.crumb{color:var(--mu)}.crumb b{color:var(--tx);font-weight:500}
.tools{display:flex;align-items:center;gap:14px}
.av{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500}
.tg{position:relative;width:56px;height:28px;padding:0;border:0;border-radius:14px;background:#5B9BD8;cursor:pointer;transition:background .4s}
.tg .k{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#F2C94C;transition:transform .4s,background .4s}
.app[data-theme=dark] .tg{background:#1B2338}.app[data-theme=dark] .tg .k{transform:translateX(28px);background:#CBD0DB}
.ttl{font-size:12px;letter-spacing:.6px;color:var(--mu);margin:6px 0 4px;text-transform:uppercase}
.sub{color:var(--mu);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--pn);border:1px solid var(--bd);padding:16px}
.ico{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc);display:flex;align-items:center;justify-content:center}
.ico svg.i{width:24px;height:24px}
.card h3{margin:0;font-size:15px;font-weight:500}
.card p{margin:0;color:var(--mu);flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 16px;border-radius:6px;background:var(--acc);color:#fff;font-size:12.5px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
@media(max-width:760px){.grid{grid-template-columns:1fr}.sb{display:none}.mn{margin-left:0;padding:10px 12px 20px}}
</style>
</head>
<body>
<div class="app" id="app" data-theme="light">
<aside class="sb" aria-label="Menu chính">
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 40 40" style="flex:none" role="img" aria-label="Logo S Class"><rect x="2" y="2" width="36" height="36" rx="11" fill="#4338CA"/><path d="M26 15C26 11.5 23 10 20 10C16.5 10 14 12 14 15C14 18.5 18 19.5 20.5 20.3C24 21.4 26.5 22.8 26.5 26C26.5 29.3 23.5 31 20 31C16.5 31 14 29.3 13.5 26.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/><path d="M31 4.5L32.2 7.8L35.5 9L32.2 10.2L31 13.5L29.8 10.2L26.5 9L29.8 7.8Z" fill="#FBBF24"/></svg>
    <b class="lbl">S Class</b>
  </div>
  <div class="cls"><div class="clogo" id="clogo"></div><div class="ctt lbl">Lớp 10A5</div></div>
  <nav id="nav"></nav>
</aside>
<main class="mn">
  <div class="top">
    <div class="crumb">S Class / Trò chơi / <b>Chia nhóm học tập</b></div>
    <div class="tools"><button class="tg" id="th" aria-label="Đổi giao diện sáng hoặc tối"><span class="k"></span></button><div class="av">PK</div></div>
  </div>
  <div class="ttl">Chia nhóm học tập</div>
  <p class="sub">Chọn trò chơi để thực hiện việc chia nhóm cho lớp.</p>
  <div class="grid" id="cards"></div>
</main>
</div>
<script>
// Đổi địa chỉ các trò chơi tại đây khi đưa lên website của bạn
const GAMES=[
  {icon:'dice',name:'Bi lăn ngẫu nhiên',desc:'Bi rơi qua các chốt và dừng ngẫu nhiên ở một ô trong danh sách tùy chỉnh.',href:'/game_chia_nhom/bi_lan.html'},
  {icon:'bulb',name:'Đèn may mắn',desc:'Các đèn nhấp nháy theo màu của từng nhóm, rồi chia đều thành viên vào các nhóm.',href:'/game_chia_nhom/den_nhap_nhay.html'}
];
const P={cal:"M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z",grid:"M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z",award:"M12 15a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM8.2 13.9 7 22l5-3 5 3-1.2-8.1",users:"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8",clip:"M9 2h6v4H9zM15 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 14l2 2 4-4",chat:"M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12z",school:"M2 9l10-5 10 5-10 5zM6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5",dice:"M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM8 8h.01M16 8h.01M8 16h.01M16 16h.01M12 12h.01",bulb:"M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"};
const ic=k=>'<svg class="i" viewBox="0 0 24 24"><path d="'+P[k]+'"/></svg>';
const $=id=>document.getElementById(id),app=$('app');
$('clogo').innerHTML=ic('school');
$('nav').innerHTML=[['cal','Event'],['grid','Class Map'],['award','Class Committee'],['users','Groups'],['clip','Duty Roster'],['chat','Feedback'],['school','Teachers'],['dice','Chia nhóm học tập',1]].map(a=>'<a class="it'+(a[2]?' on':'')+'">'+ic(a[0])+'<span class="lbl">'+a[1]+'</span></a>').join('');
GAMES.forEach(g=>{
  const c=document.createElement('div'),i=document.createElement('div'),h=document.createElement('h3'),p=document.createElement('p'),a=document.createElement('a');
  c.className='card';i.className='ico';i.innerHTML=ic(g.icon);h.textContent=g.name;p.textContent=g.desc;
  a.className='btn';a.textContent='Chơi '+g.name;a.href=g.href;a.target='_blank';a.rel='noopener';
  c.append(i,h,p,a);$('cards').appendChild(c);
});
$('th').onclick=()=>{app.dataset.theme=app.dataset.theme==='dark'?'light':'dark'};
if(matchMedia('(prefers-color-scheme:dark)').matches)app.dataset.theme='dark';
</script>
</body>
</html>
